name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate version tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release requires an existing vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    environment: Core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-cross: true
          - os: macos-14
            target: aarch64-apple-darwin
            use-cross: false

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Check package version
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version=$(awk '/^\[package\]/{p=1;next} p && /^version =/{gsub(/"/, "", $3);print $3;exit}' Cargo.toml)
          test "v$version" = "$TAG"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        env:
          MLAB_VOLUME_INGEST_URL: ${{ vars.MLAB_VOLUME_INGEST_URL }}
          MLAB_VOLUME_INGEST_KEY: ${{ secrets.MLAB_VOLUME_INGEST_KEY }}
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --locked --release --bins --target ${{ matrix.target }}
          else
            cargo build --locked --release --bins --target ${{ matrix.target }}
          fi

      - name: Package artifact
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          chmod +x scripts/package-release.sh
          scripts/package-release.sh

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz

  daemon-build:
    name: Build native daemon ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    environment: Core
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mlabd
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/emeraldls/market-lab-daemon,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=mlabd-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=mlabd-${{ matrix.arch }}
          build-args: |
            MLAB_VOLUME_INGEST_URL=${{ vars.MLAB_VOLUME_INGEST_URL }}
            MLAB_VOLUME_INGEST_KEY=${{ secrets.MLAB_VOLUME_INGEST_KEY }}

      - name: Record platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@v7
        with:
          name: daemon-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  daemon-image:
    name: Publish multi-platform daemon image
    needs: [version, daemon-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: daemon-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish architecture manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/emeraldls/market-lab-daemon
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          sources=()
          for digest in *; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create --tag "$IMAGE:$TAG" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$TAG"

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build, daemon-image]
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find dist -type f -name '*.tar.gz' -exec mv {} release-assets/ \;

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
          generate_release_notes: true
