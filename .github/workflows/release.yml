name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-cross: true
          - os: macos-14
            target: aarch64-apple-darwin
            use-cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        env:
          MLAB_VOLUME_INGEST_URL: ${{ vars.MLAB_VOLUME_INGEST_URL }}
          MLAB_VOLUME_INGEST_KEY: ${{ secrets.MLAB_VOLUME_INGEST_KEY }}
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --bins --target ${{ matrix.target }}
          else
            cargo build --release --bins --target ${{ matrix.target }}
          fi

      - name: Package artifact
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          chmod +x scripts/package-release.sh
          scripts/package-release.sh

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, daemon-image]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find dist -type f -name '*.tar.gz' -exec mv {} release-assets/ \;

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
          generate_release_notes: true

  daemon-image:
    name: Publish mlabd container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/emeraldls/market-lab-daemon
          tags: |
            type=ref,event=tag

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mlabd
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=mlabd
          cache-to: type=gha,mode=max,scope=mlabd
          build-args: |
            MLAB_VOLUME_INGEST_URL=${{ vars.MLAB_VOLUME_INGEST_URL }}
            MLAB_VOLUME_INGEST_KEY=${{ secrets.MLAB_VOLUME_INGEST_KEY }}
