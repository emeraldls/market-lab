[package]
name = "market-lab"
version = "0.1.90"
edition = "2024"
default-run = "mlab"

[[bin]]
name = "mlab"
path = "src/main.rs"

[[bin]]
name = "mlabd"
path = "src/bin/mlabd.rs"

[dependencies]
alloy-consensus = { version = "2.5", features = ["k256"] }
alloy-eips = "2.5"
alloy-signer = "2.5"
alloy-signer-local = "2.5"
alloy-primitives = { version = "1.7", default-features = false, features = ["std", "serde"] }
alloy-sol-types = "1.7"
anyhow = "1.0.102"
async-trait = "0.1.89"
base64 = "0.22.1"
bulk-keychain = "=0.1.22"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
mimalloc = "0.1"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
url = { version = "2.5", features = ["serde"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.32"
k256 = { version = "0.13.4", features = ["ecdsa"] }
sha3 = "0.10.8"
rmp-serde = "1.3.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
hex = "0.4.3"
flate2 = "1.1.2"
tar = "0.4.44"
semver = "1.0.27"
rquickjs = "0.11.0"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
rpassword = "7.4.0"
toml = "1.1.2"
zeroize = "1.8.2"
libc = "0.2"
dialoguer = { version = "0.11.0", features = ["fuzzy-select"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.4"
seccompiler = "0.5.0"
